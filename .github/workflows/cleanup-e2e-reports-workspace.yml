name: Cleanup E2E Reports (this repo)

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    uses: ./.github/workflows/cleanup-e2e-reports.yml
    with:
      head-ref: ${{ github.head_ref || '' }}
