name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      branch:
        description: 'Branch name to probe for service images'
        required: true
        type: string
    outputs:
      report-url:
        description: 'URL to the deployed Playwright HTML report'
        value: ${{ jobs.deploy-report.outputs.report-url }}

jobs:
  # Single suite, sharded three ways for wall-clock. Each shard stands up its
  # own stack, then emits a blob report; merge-reports stitches the blobs back
  # into one HTML report.
  e2e:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: DEFRA/trade-imports-workspace
          # Workspace PRs and dispatches must exercise their own stack changes.
          # A caller's event name surfaces here as its own (a frontend PR reads
          # as pull_request), so branch is the discriminator instead: it is
          # required on workflow_call and empty otherwise, and callers get main.
          ref: ${{ inputs.branch && 'main' || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}

      - name: Resolve branch tag
        id: branch-tag
        run: |
          raw="${{ inputs.branch || github.head_ref || github.ref_name }}"
          tag="${raw//\//-}"
          tag="$(printf '%s' "$tag" | tr -cd 'a-zA-Z0-9_.-')"
          tag="$(printf '%s' "$tag" | tr '[:upper:]' '[:lower:]')"
          while [[ "$tag" == [.-]* ]]; do tag="${tag:1}"; done
          tag="${tag:0:128}"
          echo "sanitised=$tag" >> "$GITHUB_OUTPUT"

          if docker manifest inspect "defradigital/trade-imports-animals-tests:${tag}" >/dev/null 2>&1; then
            echo "tests-tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Tests image: branch ($tag)"
          else
            echo "tests-tag=latest" >> "$GITHUB_OUTPUT"
            echo "Tests image: latest (no branch tag)"
          fi

      - name: Start stack
        run: ./scripts/stack/run-stack.sh --branch "${{ inputs.branch || github.head_ref || github.ref_name }}"

      - name: Assert E2E stack
        run: |
          docker run --rm \
            --network host \
            --user root \
            --entrypoint npm \
            defradigital/trade-imports-animals-tests:${{ steps.branch-tag.outputs.tests-tag }} \
            run _assert_stack

      # The runner is ephemeral, so "Start stack" above created the volume from
      # nothing and the mongo entrypoint ran the init scripts against it.
      # Assert that state rather than rebuilding it — a rebuild draws the
      # fresh-volume startup race (EUDPA-358) a second time per shard, and
      # wipes the indexes every service builds once at startup.
      - name: Assert the database is fresh
        run: |
          logs="$(docker compose -p trade-imports logs --no-color mongodb)"
          case "$logs" in
            *'MongoDB init process complete'*) ;;
            *)
              echo "::error::mongo did not run its init scripts — the volume was not fresh"
              exit 1
              ;;
          esac
          docker compose -p trade-imports exec -T mongodb \
            mongosh --quiet --eval '
              if (db.getSiblingDB("test").test.countDocuments() < 1) {
                print("seed fixtures did not apply");
                quit(1);
              }
            '

      - name: Run E2E tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: |
          docker run --rm \
            --network host \
            --user root \
            -v ${{ github.workspace }}/artifacts/blob-report:/app/blob-report \
            -v ${{ github.workspace }}/artifacts/test-results:/app/test-results \
            -v ${{ github.workspace }}/artifacts/allure-results:/app/allure-results \
            --entrypoint npm \
            defradigital/trade-imports-animals-tests:${{ steps.branch-tag.outputs.tests-tag }} \
            run test:docker-compose:ci -- \
              --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload shard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shardIndex }}
          path: |
            artifacts/blob-report/
            artifacts/test-results/
            artifacts/allure-results/
          retention-days: 14

      # Capture stack service logs before teardown so failures caused by a
      # service (not the test) are diagnosable. Runs only on failure.
      - name: Capture stack logs
        if: failure()
        run: docker compose -p trade-imports logs --no-color --timestamps > stack-logs.txt 2>&1 || true

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs-shard-${{ matrix.shardIndex }}
          path: stack-logs.txt
          retention-days: 14

      - name: Tear down stack
        if: always()
        run: docker compose -p trade-imports down

  merge-reports:
    if: always() && needs.e2e.result != 'skipped'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: all-shards/

      - name: Merge Playwright reports
        run: |
          npm install -D @playwright/test
          mkdir -p all-blob-reports
          find all-shards -path '*/blob-report/*' -exec cp {} all-blob-reports/ \;
          npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Combine allure and test results
        run: |
          mkdir -p combined-allure-results combined-test-results
          # upload-artifact roots each artifact at the least common ancestor of
          # its paths, so the `artifacts/` level is stripped: shard content
          # arrives at all-shards/shard-N/{blob-report,test-results,allure-results}.
          for shard in all-shards/*/; do
            name="$(basename "$shard")"
            if [ -d "${shard}allure-results" ]; then
              cp -r "${shard}allure-results/." combined-allure-results/
            fi
            if [ -d "${shard}test-results" ]; then
              mkdir -p "combined-test-results/$name"
              cp -r "${shard}test-results/." "combined-test-results/$name/"
            fi
          done

      - name: Upload merged reports
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            combined-allure-results/
            combined-test-results/
          retention-days: 14

  deploy-report:
    needs: [e2e, merge-reports]
    if: always() && needs.merge-reports.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      report-url: ${{ steps.url.outputs.report-url }}
    steps:
      - name: Download merged report
        uses: actions/download-artifact@v4
        with:
          name: e2e-report
          path: report/

      - name: Resolve branch tag
        id: branch-tag
        run: |
          raw="${{ inputs.branch || github.head_ref || github.ref_name }}"
          tag="${raw//\//-}"
          tag="$(printf '%s' "$tag" | tr -cd 'a-zA-Z0-9_.-')"
          tag="$(printf '%s' "$tag" | tr '[:upper:]' '[:lower:]')"
          while [[ "$tag" == [.-]* ]]; do tag="${tag:1}"; done
          tag="${tag:0:128}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report/playwright-report
          destination_dir: e2e/${{ steps.branch-tag.outputs.tag }}
          keep_files: true

      - name: Output report URL
        id: url
        run: |
          repo="${{ github.repository }}"
          owner="${repo%%/*}"
          name="${repo##*/}"
          owner_lc="$(echo "$owner" | tr '[:upper:]' '[:lower:]')"
          echo "report-url=https://${owner_lc}.github.io/${name}/e2e/${{ steps.branch-tag.outputs.tag }}/" >> "$GITHUB_OUTPUT"
