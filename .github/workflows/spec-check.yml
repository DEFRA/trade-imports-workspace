name: Spec check

on:
  pull_request:
    paths:
      - 'openspec/**'
      - 'tim/src/spec/**'
      - '.github/workflows/spec-check.yml'

permissions:
  contents: read

concurrency:
  group: spec-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tim/package-lock.json

      - name: Install tim
        run: npm ci

      - name: Create the repos folder that marks the workspace root
        working-directory: .
        run: mkdir -p repos

      - name: Lint the Behaviour Spec
        run: |
          set +e
          npm run --silent tim -- spec lint --no-ui > "$RUNNER_TEMP/spec-lint.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/spec-lint.txt"
          {
            echo '## Spec lint'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/spec-lint.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
