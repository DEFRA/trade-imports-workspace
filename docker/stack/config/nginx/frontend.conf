# Reproduces the CDP platform nginx-upstreams sidecar in front of the frontend
# pod: a 10M default cap on / and a 2304M bypass on /upload-and-scan proxying
# direct to cdp-uploader. Mirrors DEFRA/cdp-nginx-upstreams server.conf.tpl.

server {
    listen 3000;

    client_max_body_size 10M;

    # Docker's embedded DNS with a short TTL, read through a variable in
    # proxy_pass so upstreams re-resolve per request. Without this nginx caches
    # the upstream IP at worker init and every request 502s after a recreate
    # until this container is bounced.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /upload-and-scan {
        client_max_body_size 2304M;
        set $upstream_uploader "http://cdp-uploader:7337";
        proxy_pass $upstream_uploader;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        set $upstream_frontend "http://trade-imports-animals-frontend:3000";
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
