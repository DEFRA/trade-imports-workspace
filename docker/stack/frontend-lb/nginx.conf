error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  access_log off;
  resolver 127.0.0.11 valid=5s ipv6=off;

  # nginx defaults to a 1 MB body; the animals documents page posts a 10 MB file.
  client_max_body_size 12m;

  proxy_http_version 1.1;
  proxy_connect_timeout 10s;
  proxy_set_header Host $http_host;

  server {
    listen 3000;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
      # A variable makes nginx resolve the name per request, which is what spreads traffic across replicas.
      set $upstream trade-imports-animals-frontend;
      proxy_pass http://$upstream:3000$request_uri;
    }
  }

  server {
    listen 3001;

    location / {
      set $upstream trade-imports-animals-admin;
      proxy_pass http://$upstream:3001$request_uri;
    }
  }

  server {
    listen 3002;

    location / {
      set $upstream trade-imports-ins-frontend;
      proxy_pass http://$upstream:3002$request_uri;
    }
  }
}
