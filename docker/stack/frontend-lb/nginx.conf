# Round-robins the host's :3000 across however many animals-frontend replicas
# are running. The frontend is a single Node process pinned at one core from
# eight Playwright workers upward, so replicas are the only way to give the
# journey more than one core.
#
# Safe to round-robin because nothing in the frontend is held in process
# memory across requests: sessions live in Redis (SESSION_CACHE_ENGINE=redis)
# and Bell keeps the OIDC handshake in a cookie encrypted with a password all
# replicas share from shared.env.

events {
  worker_connections 4096;
}

http {
  access_log off;
  error_log /dev/stderr warn;

  # Docker's embedded DNS. The frontend's service name resolves to every
  # replica's address, and a short TTL means a replica that restarts is picked
  # up without restarting nginx.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 3000;
    server_name _;

    # A big journey page under load can take a while when the replicas are
    # saturated; failing at nginx would hide that as a proxy error rather than
    # the slow response it is.
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # The browser and the OIDC redirect URLs both say localhost:3000, and the
    # frontend builds absolute URLs from the Host header, so it has to survive
    # the hop unchanged.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location / {
      # Naming the upstream in a variable forces nginx to resolve it per
      # request rather than once at startup: that is what spreads requests
      # across the replicas, and it also lets nginx start before they are up.
      set $frontend trade-imports-animals-frontend;
      proxy_pass http://$frontend:3000$request_uri;
    }
  }
}
