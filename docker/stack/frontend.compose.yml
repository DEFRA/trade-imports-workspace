services:
  trade-imports-animals-admin:
    profiles: [frontend]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      # The OIDC discovery document is fetched during boot, before server.start().
      trade-imports-defra-id-stub:
        condition: service_healthy
        required: false
    env_file:
      - ./shared.env
    environment:
      - PORT=3001
      - NODE_ENV=development
      - SESSION_CACHE_ENGINE=redis
      - TRADE_IMPORTS_ANIMALS_BACKEND_URL=http://host.docker.internal:8085
      - TRADE_IMPORTS_DYNAMICS_GATEWAY_URL=http://host.docker.internal:8088
      - DEFRA_ID_OIDC_CONFIGURATION_URL=http://host.docker.internal:3007/idphub/b2c/b2c_1a_cui_cpdev_signupsigninsfi/.well-known/openid-configuration
      - DEFRA_ID_REDIRECT_URL=http://localhost:3001/auth/sign-in-oidc
      - DEFRA_ID_SIGN_OUT_REDIRECT_URL=http://localhost:3001/auth/sign-out-oidc
      - DEFRA_ID_SIGN_OUT_HOSTNAME_REWRITE_ENABLED=true
    healthcheck:
      # start_period covers the boot window under a CPU-contended cold start.
      interval: 5s
      retries: 5
      start_period: 30s
      timeout: 5s
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3001/health
    image: defradigital/trade-imports-animals-admin:${TRADE_IMPORTS_ANIMALS_ADMIN:-latest}
    platform: linux/amd64
    ports:
      - '3001:3001'
  trade-imports-animals-frontend:
    profiles: [frontend]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      cdp-uploader:
        condition: service_started
      redis:
        condition: service_healthy
      trade-imports-defra-id-stub:
        condition: service_healthy
        required: false
      trade-imports-reference-data:
        condition: service_healthy
    env_file:
      - ./shared.env
    environment:
      - PORT=3000
      - NODE_ENV=development
      - SESSION_CACHE_ENGINE=redis
      - TRADE_IMPORTS_ANIMALS_BACKEND_URL=http://host.docker.internal:8085
      - TRADE_IMPORTS_REFERENCE_DATA_URL=http://host.docker.internal:8086
      - TRADE_IMPORTS_ADDRESS_BOOK_URL=http://host.docker.internal:8089
      - LIVE_ANIMALS_MODE=real
      - DEFRA_ID_OIDC_CONFIGURATION_URL=http://host.docker.internal:3007/idphub/b2c/b2c_1a_cui_cpdev_signupsigninsfi/.well-known/openid-configuration
      - DEFRA_ID_REDIRECT_URL=http://localhost:3000/auth/sign-in-oidc
      - DEFRA_ID_SIGN_OUT_REDIRECT_URL=http://localhost:3000/auth/sign-out-oidc
      - DEFRA_ID_SIGN_OUT_HOSTNAME_REWRITE_ENABLED=true
    healthcheck:
      # start_period covers the boot window under a CPU-contended cold start.
      interval: 5s
      retries: 5
      start_period: 30s
      timeout: 5s
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/health
    image: defradigital/trade-imports-animals-frontend:${TRADE_IMPORTS_ANIMALS_FRONTEND:-latest}
    platform: linux/amd64
    # No host port: the replicas sit behind trade-imports-animals-frontend-lb,
    # which owns :3000. Publishing here would stop more than one from starting.
    deploy:
      replicas: ${FRONTEND_REPLICAS:-1}
  # One Node process serves the whole journey and saturates a core from eight
  # Playwright workers upward, so extra workers only lengthen its queue. This
  # fronts N replicas on the one host port the tests and the OIDC redirect URLs
  # both name. Default of one replica keeps the stack as it was.
  trade-imports-animals-frontend-lb:
    profiles: [frontend]
    depends_on:
      trade-imports-animals-frontend:
        condition: service_healthy
    image: nginx:1.29-alpine
    healthcheck:
      interval: 5s
      retries: 5
      start_period: 10s
      timeout: 5s
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/health
    ports:
      - '3000:3000'
    volumes:
      - ./frontend-lb/nginx.conf:/etc/nginx/nginx.conf:ro
  trade-imports-ins-frontend:
    profiles: [frontend]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      trade-imports-defra-id-stub:
        condition: service_healthy
        required: false
      # Countries are primed at boot from reference-data; without this the
      # frontend can fetch before Spring is listening and exit(1).
      trade-imports-reference-data:
        condition: service_healthy
    env_file:
      - ./shared.env
    environment:
      - PORT=3002
      - NODE_ENV=development
      - LOG_FORMAT=ecs
      - REDIS_TLS=false
      - SESSION_CACHE_ENGINE=redis
      - TRADE_IMPORTS_ADDRESS_BOOK_URL=http://host.docker.internal:8089
      - TRADE_IMPORTS_REFERENCE_DATA_URL=http://host.docker.internal:8086
      - DEFRA_ID_OIDC_CONFIGURATION_URL=http://host.docker.internal:3007/idphub/b2c/b2c_1a_cui_cpdev_signupsigninsfi/.well-known/openid-configuration
      - DEFRA_ID_REDIRECT_URL=http://localhost:3002/auth/sign-in-oidc
      - DEFRA_ID_SIGN_OUT_REDIRECT_URL=http://localhost:3002/auth/sign-out-oidc
      - DEFRA_ID_SIGN_OUT_HOSTNAME_REWRITE_ENABLED=true
    healthcheck:
      # start_period covers the boot window under a CPU-contended cold start.
      interval: 5s
      retries: 5
      start_period: 30s
      timeout: 5s
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3002/health
    image: defradigital/trade-imports-ins-frontend:${TRADE_IMPORTS_INS_FRONTEND:-latest}
    platform: linux/amd64
    ports:
      - '3002:3002'
