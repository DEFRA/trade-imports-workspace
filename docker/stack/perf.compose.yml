# Performance mode (run-stack.sh --perf, tim docker perf): both stubs answer at
# the latency profile in STUB_PROFILE, default sla. Never in the gate's stack.
services:
  trade-imports-stub:
    environment:
      - STUB_LATENCY_PROFILE=${STUB_PROFILE:-sla}
  trade-imports-defra-id-stub:
    environment:
      - STUB_LATENCY_PROFILE=${STUB_PROFILE:-sla}
